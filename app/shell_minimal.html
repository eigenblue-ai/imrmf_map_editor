<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMF Map Editor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0f14;
        color: #ddd;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      #header {
        background: rgba(0, 0, 0, 0.3);
        padding: 4px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        color: #fff;
      }
      #header #loading {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
      #canvas-container {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      .spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      .hidden {
        display: none;
      }
      #output {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="header">
        <h1>RMF Map Editor</h1>
        <span id="loading">Loading...</span>
      </div>
      <div id="canvas-container">
        <div id="spinner" class="spinner"></div>
        <canvas
          id="canvas"
          oncontextmenu="event.preventDefault()"
          tabindex="-1"
        ></canvas>
      </div>
    </div>
    <div id="output"></div>

    <script>
      var spinnerElement = document.getElementById("spinner");
      var loadingElement = document.getElementById("loading");
      var Module = {
        canvas: document.getElementById("canvas"),
        // Cache-bust so a plain reload gets the latest build.
        locateFile: function (path, prefix) {
          return prefix + path + "?v=" + Date.now();
        },
        print: function (t) {
          console.log(t);
        },
        printErr: function (t) {
          console.error(t);
        },
        setStatus: function (text) {
          if (text === "") {
            spinnerElement.classList.add("hidden");
            loadingElement.classList.add("hidden");
          } else {
            spinnerElement.classList.remove("hidden");
            loadingElement.classList.remove("hidden");
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "Preparing..." : "");
        },
      };
      Module.setStatus("Downloading...");
      window.onerror = function () {
        spinnerElement.classList.add("hidden");
        loadingElement.classList.add("hidden");
      };
    </script>

    <script type="importmap">
      { "imports": { "yjs": "https://esm.sh/yjs@13.6.18" } }
    </script>

    <script type="module">
      // imrmf: client-side bridge between the wasm UI and the server.
      //
      // Three responsibilities:
      //   1. Storage mount/unmount HTTP calls.
      //   2. Yjs CRDT connection lifecycle. Lazy-loaded so a page that never
      //      connects doesn't pay the network cost for yjs + y-websocket.
      //   3. sessionStorage roundtrip for the active connection blob so reloads
      //      skip the modal.

      const SESSION_KEY = "imrmf.connection";
      const yjsApi = makeStubApi();
      const imrmf = {
        yjs: yjsApi,
        _provider: null,
        _doc: null,
        _libs: null,
        _connection: null,

        getSession() {
          const raw = sessionStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          try {
            return JSON.parse(raw);
          } catch (_) {
            return null;
          }
        },
        saveSession(obj) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(obj));
        },
        clearSession() {
          sessionStorage.removeItem(SESSION_KEY);
        },

        async mount(serverUrl, config) {
          const r = await fetch(joinUrl(serverUrl, "/mount"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          });
          if (!r.ok) throw new Error("mount failed: " + (await r.text()));
          return r.json();
        },
        async fetchConfig(serverUrl) {
          try {
            const r = await fetch(joinUrl(serverUrl, "/config"));
            if (!r.ok) return null;
            return r.json();
          } catch (_) {
            return null;
          }
        },
        async listBuildings(serverUrl) {
          const r = await fetch(joinUrl(serverUrl, "/buildings"));
          if (!r.ok)
            throw new Error("list buildings failed: " + (await r.text()));
          return r.json();
        },
        async unmount(serverUrl) {
          await fetch(joinUrl(serverUrl, "/unmount"), { method: "POST" });
        },
        async loadBuilding(serverUrl, buildingId) {
          const r = await fetch(
            joinUrl(
              serverUrl,
              "/buildings/" + encodeURIComponent(buildingId) + "/load",
            ),
            {
              method: "POST",
            },
          );
          if (!r.ok) throw new Error("load failed: " + (await r.text()));
        },
        async mountStatus(serverUrl) {
          const r = await fetch(joinUrl(serverUrl, "/mount/status"));
          return r.json();
        },

        async connect(serverUrl, buildingId) {
          if (!this._libs) {
            const [Y, ywebsocket, jsyaml] = await Promise.all([
              import("https://esm.sh/yjs@13.6.18"),
              import("https://esm.sh/y-websocket@2.0.4?external=yjs"),
              import("https://esm.sh/js-yaml@4.1.0"),
            ]);
            this._libs = {
              Y,
              WebsocketProvider: ywebsocket.WebsocketProvider,
              jsyaml: jsyaml.default || jsyaml,
            };
          }
          const { Y, WebsocketProvider, jsyaml } = this._libs;
          const wsBase = wsUrlFor(serverUrl);
          const doc = new Y.Doc();
          const provider = new WebsocketProvider(wsBase, buildingId, doc);
          const buildingMap = doc.getMap("building");

          let connectStatus = "connecting";
          let syncComplete = false;
          let remoteDirty = false;
          provider.on("status", (e) => {
            connectStatus = e.status;
          });
          provider.on("sync", (isSynced) => {
            syncComplete = isSynced;
            if (isSynced) remoteDirty = true;
          });
          buildingMap.observeDeep((events, txn) => {
            if (txn && txn.origin === "local") return;
            remoteDirty = true;
          });

          Object.assign(
            this.yjs,
            buildApi({
              Y,
              jsyaml,
              doc,
              buildingMap,
              getStatus: () => connectStatus,
              isSynced: () => syncComplete,
              isRemoteDirty: () => remoteDirty,
              clearRemoteDirty: () => {
                remoteDirty = false;
              },
            }),
          );

          this._provider = provider;
          this._doc = doc;
          this._connection = { serverUrl, buildingId };
          await new Promise((resolve) => {
            if (syncComplete) return resolve();
            const handler = (isSynced) => {
              if (isSynced) {
                provider.off("sync", handler);
                resolve();
              }
            };
            provider.on("sync", handler);
          });
        },

        disconnect() {
          if (this._provider) {
            try {
              this._provider.destroy();
            } catch (_) {}
          }
          if (this._doc) {
            try {
              this._doc.destroy();
            } catch (_) {}
          }
          this._provider = null;
          this._doc = null;
          this._connection = null;
          Object.assign(this.yjs, makeStubApi());
        },

        isConnected() {
          return this._provider !== null;
        },
        currentConnection() {
          return this._connection;
        },
      };

      function joinUrl(base, path) {
        if (!base) return path;
        return base.replace(/\/+$/, "") + path;
      }

      function wsUrlFor(httpUrl) {
        let u = httpUrl;
        if (!u || u.startsWith("/")) u = location.origin + (u || "");
        return u.replace(/^http/, "ws").replace(/\/+$/, "") + "/ws";
      }

      function makeStubApi() {
        return {
          getStatus: () => "disconnected",
          isSynced: () => false,
          isRemoteDirty: () => false,
          clearRemoteDirty: () => {},
          snapshotYaml: () => "",
          applyLocalYaml: () => {},
          vertexAdd: () => {},
          vertexReplace: () => {},
          vertexDelete: () => {},
          laneAdd: () => {},
          laneReplace: () => {},
          laneDelete: () => {},
          wallAdd: () => {},
          wallReplace: () => {},
          wallDelete: () => {},
          doorAdd: () => {},
          doorReplace: () => {},
          doorDelete: () => {},
          measurementAdd: () => {},
          measurementReplace: () => {},
          measurementDelete: () => {},
          floorAdd: () => {},
          floorReplace: () => {},
          floorDelete: () => {},
          layerSet: () => {},
          layerDelete: () => {},
          layerReorder: () => {},
          drawingSet: () => {},
          fiducialAdd: () => {},
          fiducialReplace: () => {},
          fiducialDelete: () => {},
          setReferenceLevelName: () => {},
          undo: () => {},
          redo: () => {},
          canUndo: () => false,
          canRedo: () => false,
        };
      }

      function buildApi({
        Y,
        jsyaml,
        doc,
        buildingMap,
        getStatus,
        isSynced,
        isRemoteDirty,
        clearRemoteDirty,
      }) {
        // js-yaml can't dump BigInts, Maps, or Sets. Yjs surfaces integer-typed
        // values as JS bigint here, so we demote to Number before dump.
        function toPlain(value) {
          if (value === null || typeof value === "undefined") return value;
          if (typeof value === "bigint") return Number(value);
          if (typeof value !== "object") return value;
          if (value instanceof Map) {
            const o = {};
            for (const [k, v] of value) o[k] = toPlain(v);
            return o;
          }
          if (value instanceof Set) return Array.from(value, toPlain);
          if (Array.isArray(value)) return value.map(toPlain);
          const o = {};
          for (const [k, v] of Object.entries(value)) o[k] = toPlain(v);
          return o;
        }

        function yScalar(v) {
          return typeof v === "bigint" ? Number(v) : v;
        }

        function setKey(parent, key, value) {
          if (value === undefined) return;
          if (value === null || typeof value !== "object") {
            parent.set(key, yScalar(value));
            return;
          }
          if (Array.isArray(value)) {
            const a = new Y.Array();
            parent.set(key, a);
            fillArr(a, value);
            return;
          }
          const m = new Y.Map();
          parent.set(key, m);
          for (const [kk, vv] of Object.entries(value)) setKey(m, kk, vv);
        }
        function fillArr(arr, source) {
          for (const v of source) {
            if (v === null || typeof v !== "object") {
              arr.push([v === undefined ? null : yScalar(v)]);
            } else if (Array.isArray(v)) {
              const a = new Y.Array();
              arr.push([a]);
              fillArr(a, v);
            } else {
              const m = new Y.Map();
              arr.push([m]);
              for (const [k, vv] of Object.entries(v)) setKey(m, k, vv);
            }
          }
        }
        function rebuildMap(target, source) {
          for (const k of Array.from(target.keys())) target.delete(k);
          if (!source || typeof source !== "object") return;
          for (const [k, v] of Object.entries(source)) setKey(target, k, v);
        }
        function getOrCreateMap(parent, key) {
          let m = parent.get(key);
          if (!m) {
            m = new Y.Map();
            parent.set(key, m);
          }
          return m;
        }
        function getOrCreateArr(parent, key) {
          let a = parent.get(key);
          if (!a) {
            a = new Y.Array();
            parent.set(key, a);
          }
          return a;
        }
        function getLevel(name) {
          const levels = getOrCreateMap(buildingMap, "levels");
          return getOrCreateMap(levels, name);
        }
        function attachArrayInto(parent, idx, parsedArr) {
          const a = new Y.Array();
          if (idx < 0 || idx >= parent.length) parent.push([a]);
          else parent.insert(idx, [a]);
          fillArr(a, parsedArr);
          return a;
        }
        function attachMapInto(parent, key, parsedObj) {
          if (parent.has(key)) parent.delete(key);
          const m = new Y.Map();
          parent.set(key, m);
          for (const [k, v] of Object.entries(parsedObj)) setKey(m, k, v);
          return m;
        }
        // Array element that is itself a map (floors), not a tuple (edges).
        function attachObjIntoArr(parent, idx, parsedObj) {
          const m = new Y.Map();
          if (idx < 0 || idx >= parent.length) parent.push([m]);
          else parent.insert(idx, [m]);
          for (const [k, v] of Object.entries(parsedObj)) setKey(m, k, v);
          return m;
        }
        function parseYamlOrLog(yamlStr, what) {
          try {
            return jsyaml.load(yamlStr);
          } catch (e) {
            console.error("[imrmf] parse", what, "failed:", e);
            return null;
          }
        }

        function snapshotYaml() {
          return jsyaml.dump(toPlain(buildingMap.toJSON()));
        }
        function applyLocalYaml(yamlStr) {
          let obj;
          try {
            obj = jsyaml.load(yamlStr);
          } catch (e) {
            console.error("[imrmf] local YAML parse failed:", e);
            return;
          }
          if (!obj || typeof obj !== "object") return;
          doc.transact(() => rebuildMap(buildingMap, obj), "local");
        }

        function vertexAdd(levelName, vertexYaml) {
          const parsed = parseYamlOrLog(vertexYaml, "vertex");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const vertices = getOrCreateArr(getLevel(levelName), "vertices");
            attachArrayInto(vertices, vertices.length, parsed);
          }, "local");
        }
        function vertexReplace(levelName, idx, vertexYaml) {
          const parsed = parseYamlOrLog(vertexYaml, "vertex");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const vertices = getLevel(levelName).get("vertices");
            if (!vertices || idx < 0 || idx >= vertices.length) return;
            vertices.delete(idx, 1);
            attachArrayInto(vertices, idx, parsed);
          }, "local");
        }
        // Drop tuple edges touching idx, shift higher endpoints down.
        function reindexEdgeArray(level, key, idx) {
          const arr = level.get(key);
          if (!arr) return;
          for (let i = arr.length - 1; i >= 0; --i) {
            const e = arr.get(i);
            if (!(e instanceof Y.Array)) continue;
            const s = Number(e.get(0)),
              en = Number(e.get(1));
            if (s === idx || en === idx) {
              arr.delete(i, 1);
            } else if (s > idx || en > idx) {
              const ns = s > idx ? s - 1 : s;
              const ne = en > idx ? en - 1 : en;
              let params = null;
              if (e.length >= 3) {
                const p = e.get(2);
                params = p && p.toJSON ? p.toJSON() : p;
              }
              const replacement = [ns, ne];
              if (params) replacement.push(params);
              arr.delete(i, 1);
              attachArrayInto(arr, i, replacement);
            }
          }
        }
        function reindexFloors(level, idx) {
          const arr = level.get("floors");
          if (!arr) return;
          const reLoop = (loop) =>
            (loop || [])
              .map(Number)
              .filter((v) => v !== idx)
              .map((v) => (v > idx ? v - 1 : v));
          for (let i = arr.length - 1; i >= 0; --i) {
            const fm = arr.get(i);
            const f = fm && fm.toJSON ? fm.toJSON() : null;
            if (!f) continue;
            const verts = reLoop(f.vertices);
            if (verts.length < 3) {
              arr.delete(i, 1);
              continue;
            }
            const holes = (f.holes || [])
              .map(reLoop)
              .filter((h) => h.length >= 3);
            const nf = Object.assign({}, f, { vertices: verts });
            if (holes.length) nf.holes = holes;
            else delete nf.holes;
            arr.delete(i, 1);
            attachObjIntoArr(arr, i, nf);
          }
        }
        function vertexDelete(levelName, idx) {
          doc.transact(() => {
            const level = getLevel(levelName);
            const vertices = level.get("vertices");
            if (!vertices || idx < 0 || idx >= vertices.length) return;
            vertices.delete(idx, 1);
            reindexEdgeArray(level, "lanes", idx);
            reindexEdgeArray(level, "walls", idx);
            reindexEdgeArray(level, "doors", idx);
            reindexEdgeArray(level, "measurements", idx);
            reindexFloors(level, idx);
          }, "local");
        }
        function laneAdd(levelName, laneYaml) {
          const parsed = parseYamlOrLog(laneYaml, "lane");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const lanes = getOrCreateArr(getLevel(levelName), "lanes");
            attachArrayInto(lanes, lanes.length, parsed);
          }, "local");
        }
        function laneReplace(levelName, idx, laneYaml) {
          const parsed = parseYamlOrLog(laneYaml, "lane");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const lanes = getLevel(levelName).get("lanes");
            if (!lanes || idx < 0 || idx >= lanes.length) return;
            lanes.delete(idx, 1);
            attachArrayInto(lanes, idx, parsed);
          }, "local");
        }
        function laneDelete(levelName, idx) {
          doc.transact(() => {
            const lanes = getLevel(levelName).get("lanes");
            if (!lanes || idx < 0 || idx >= lanes.length) return;
            lanes.delete(idx, 1);
          }, "local");
        }
        // walls / doors / measurements share the lane tuple shape.
        function makeEdgeOps(key) {
          return {
            add(levelName, yaml) {
              const parsed = parseYamlOrLog(yaml, key);
              if (!Array.isArray(parsed)) return;
              doc.transact(() => {
                const arr = getOrCreateArr(getLevel(levelName), key);
                attachArrayInto(arr, arr.length, parsed);
              }, "local");
            },
            replace(levelName, idx, yaml) {
              const parsed = parseYamlOrLog(yaml, key);
              if (!Array.isArray(parsed)) return;
              doc.transact(() => {
                const arr = getLevel(levelName).get(key);
                if (!arr || idx < 0 || idx >= arr.length) return;
                arr.delete(idx, 1);
                attachArrayInto(arr, idx, parsed);
              }, "local");
            },
            del(levelName, idx) {
              doc.transact(() => {
                const arr = getLevel(levelName).get(key);
                if (!arr || idx < 0 || idx >= arr.length) return;
                arr.delete(idx, 1);
              }, "local");
            },
          };
        }
        const wallOps = makeEdgeOps("walls");
        const doorOps = makeEdgeOps("doors");
        const measOps = makeEdgeOps("measurements");

        function floorAdd(levelName, yaml) {
          const parsed = parseYamlOrLog(yaml, "floor");
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed))
            return;
          doc.transact(() => {
            const arr = getOrCreateArr(getLevel(levelName), "floors");
            attachObjIntoArr(arr, arr.length, parsed);
          }, "local");
        }
        function floorReplace(levelName, idx, yaml) {
          const parsed = parseYamlOrLog(yaml, "floor");
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed))
            return;
          doc.transact(() => {
            const arr = getLevel(levelName).get("floors");
            if (!arr || idx < 0 || idx >= arr.length) return;
            arr.delete(idx, 1);
            attachObjIntoArr(arr, idx, parsed);
          }, "local");
        }
        function floorDelete(levelName, idx) {
          doc.transact(() => {
            const arr = getLevel(levelName).get("floors");
            if (!arr || idx < 0 || idx >= arr.length) return;
            arr.delete(idx, 1);
          }, "local");
        }
        function layerSet(levelName, layerName, layerYaml) {
          const parsed = parseYamlOrLog(layerYaml, "layer");
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed))
            return;
          doc.transact(() => {
            const layers = getOrCreateMap(getLevel(levelName), "layers");
            attachMapInto(layers, layerName, parsed);
          }, "local");
        }
        function layerDelete(levelName, layerName) {
          doc.transact(() => {
            const layers = getLevel(levelName).get("layers");
            if (!layers || !layers.has(layerName)) return;
            layers.delete(layerName);
          }, "local");
        }
        function drawingSet(levelName, filename) {
          doc.transact(() => {
            const drawing = getOrCreateMap(getLevel(levelName), "drawing");
            drawing.set("filename", filename);
          }, "local");
        }
        function fiducialAdd(levelName, fiducialYaml) {
          const parsed = parseYamlOrLog(fiducialYaml, "fiducial");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const fiducials = getOrCreateArr(getLevel(levelName), "fiducials");
            attachArrayInto(fiducials, fiducials.length, parsed);
          }, "local");
        }
        function fiducialReplace(levelName, idx, fiducialYaml) {
          const parsed = parseYamlOrLog(fiducialYaml, "fiducial");
          if (!Array.isArray(parsed)) return;
          doc.transact(() => {
            const fiducials = getLevel(levelName).get("fiducials");
            if (!fiducials || idx < 0 || idx >= fiducials.length) return;
            fiducials.delete(idx, 1);
            attachArrayInto(fiducials, idx, parsed);
          }, "local");
        }
        function fiducialDelete(levelName, idx) {
          doc.transact(() => {
            const fiducials = getLevel(levelName).get("fiducials");
            if (!fiducials || idx < 0 || idx >= fiducials.length) return;
            fiducials.delete(idx, 1);
          }, "local");
        }

        // Y.Map iteration order is insertion order with no positional ops, so
        // reorder is: snapshot, wipe, re-insert in the requested order.
        function layerReorder(levelName, names) {
          if (!Array.isArray(names)) return;
          doc.transact(() => {
            const layers = getLevel(levelName).get("layers");
            if (!layers) return;
            const snapshot = new Map();
            for (const k of layers.keys()) {
              const v = layers.get(k);
              snapshot.set(k, v && v.toJSON ? v.toJSON() : v);
            }
            for (const k of Array.from(layers.keys())) layers.delete(k);
            const inserted = new Set();
            for (const name of names) {
              if (snapshot.has(name)) {
                attachMapInto(layers, name, snapshot.get(name));
                inserted.add(name);
              }
            }
            for (const [k, v] of snapshot) {
              if (!inserted.has(k)) attachMapInto(layers, k, v);
            }
          }, "local");
        }

        function setReferenceLevelName(name) {
          doc.transact(() => {
            if (name) buildingMap.set("reference_level_name", name);
            else buildingMap.delete("reference_level_name");
          }, "local");
        }

        const undoManager = new Y.UndoManager(buildingMap, {
          trackedOrigins: new Set(["local"]),
        });

        return {
          getStatus,
          isSynced,
          isRemoteDirty,
          clearRemoteDirty,
          snapshotYaml,
          applyLocalYaml,
          vertexAdd,
          vertexReplace,
          vertexDelete,
          laneAdd,
          laneReplace,
          laneDelete,
          wallAdd: wallOps.add,
          wallReplace: wallOps.replace,
          wallDelete: wallOps.del,
          doorAdd: doorOps.add,
          doorReplace: doorOps.replace,
          doorDelete: doorOps.del,
          measurementAdd: measOps.add,
          measurementReplace: measOps.replace,
          measurementDelete: measOps.del,
          floorAdd,
          floorReplace,
          floorDelete,
          layerSet,
          layerDelete,
          layerReorder,
          drawingSet,
          fiducialAdd,
          fiducialReplace,
          fiducialDelete,
          setReferenceLevelName,
          undo: () => undoManager.undo(),
          redo: () => undoManager.redo(),
          canUndo: () => undoManager.canUndo(),
          canRedo: () => undoManager.canRedo(),
        };
      }

      window.imrmf = imrmf;
    </script>
